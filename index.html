<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting to ScanBIM...</title>
  <link rel="canonical" href="https://scanbim.org/" />
  <meta http-equiv="refresh" content="0; url=https://scanbim.org/" />
  <script>
    // Redirect immediately while preserving any query parameters and hash
    var targetUrl = "https://scanbim.org/" + window.location.search + window.location.hash;
    window.location.replace(targetUrl);
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #050b14;
      color: #e8edf4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .container {
      max-width: 500px;
      padding: 40px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(0, 120, 215, 0.2);
      border-top-color: #0078d7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: #ffffff;
    }
    p {
      color: #7a8fa6;
      font-size: 0.95rem;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    a.btn {
      display: inline-block;
      padding: 12px 24px;
      background: #0078d7;
      color: #ffffff;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      border-radius: 8px;
      transition: background 0.2s ease;
    }
    a.btn:hover {
      background: #0086f0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h1>Redirecting to ScanBIM</h1>
    <p>We have moved to our new website at <strong>scanbim.org</strong>.<br>Taking you there now...</p>
    <a id="redirect-link" class="btn" href="https://scanbim.org/">Click here if not redirected</a>
  </div>

  <script>
    // Ensure the manual button also preserves search/hash parameters
    document.getElementById("redirect-link").href = targetUrl;
  </script>
</body>
</html>
